<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每日能量曆 2026–2027</title>
<meta name="description" content="每日幸運色、吉方位、正念小語與宜忌查詢">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2a2420;--mute:#8a7f72;--line:#e7dccb;--acc:#a8322d;--gold:#b8892d;--good:#2f7d4f;--bad:#b23b3b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.6;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 20px) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
.brand{font-family:"Noto Serif TC",serif;font-weight:900;font-size:19px;letter-spacing:.06em}
.brand small{display:block;font-family:"Noto Sans TC";font-weight:400;font-size:11px;color:var(--mute);letter-spacing:.1em}
.tabs{display:flex;background:#ebe2d2;border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;color:var(--mute);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.nav button,.nav label{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;min-width:40px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 10px}
.nav .mid{flex:1;position:relative;font-weight:500}
.nav input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{text-align:center;padding:20px 16px 16px;position:relative;overflow:hidden}
.hero .solar{font-size:13px;color:var(--mute);letter-spacing:.08em}
.hero .big{font-family:"Noto Serif TC",serif;font-weight:900;font-size:64px;line-height:1.05;color:var(--acc);margin:6px 0 2px}
.hero .gz{font-family:"Noto Serif TC",serif;font-size:26px;font-weight:600;letter-spacing:.2em}
.hero .lunar{color:var(--mute);font-size:13px;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.pill{font-size:12.5px;padding:3px 10px;border-radius:999px;background:#f1e9db;color:#5c5145}
.pill.fest{background:#fbe5e1;color:var(--acc)}
.pill.term{background:#e8efe1;color:#3f6b2e}
.rate{font-size:22px;margin-top:10px;min-height:30px}
.rate .lbl{font-size:12px;color:var(--mute);display:block}
h3{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.12em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
h3:before{content:"";width:4px;height:14px;border-radius:2px;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:10px;background:#fbf3e1;border:1px solid #efdfbd;color:#7a5a17;font-weight:500;font-size:14px}
.empty{color:var(--mute);font-size:13px}
.colors{display:grid;gap:8px}
.crow{display:flex;align-items:center;gap:10px}
.crow .lv{width:58px;font-size:12px;color:var(--mute)}
.crow .stars{font-size:18px;letter-spacing:1px;color:#e0a800;text-shadow:0 1px 0 #b07d00}
.sw{display:flex;gap:4px}
.sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}
.crow .nm{font-size:14px}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dir{background:#faf6ee;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.dir .k{font-size:12px;color:var(--mute)}
.dir .v{font-size:15px;font-weight:700;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:4px}
.arrow{display:inline-block;width:16px;height:16px;transition:transform .2s}
.dir .src{font-size:10.5px;color:#b0a594;margin-top:2px}
.yj{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start}
.yj .t{font-family:"Noto Serif TC",serif;font-weight:900;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.yj .t.g{background:var(--good)}.yj .t.b{background:var(--bad)}
.yj .l{padding-top:4px;font-size:14px}
.energy p{white-space:pre-line;font-size:15px;line-height:1.85}
.charge{margin-top:12px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#fbefd4,#f7e3e0);font-weight:500}
.charge span{font-size:12px;color:var(--mute);display:block;font-weight:400}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;font-size:13.5px}
.meta div span{color:var(--mute);margin-right:6px}
.week .row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.week .row:last-child{border:0}
.week .row.today .d{background:var(--acc);color:#fff}
.week .row.sel{background:#faf3e6;border-radius:12px}
.week .d{text-align:center;border-radius:12px;padding:4px 0;background:#f1e9db}
.week .d b{display:block;font-size:20px;font-family:"Noto Serif TC",serif;line-height:1.2}
.week .d small{font-size:11px}
.week .info .top{font-weight:700;font-size:15px}
.week .info .top em{font-style:normal;font-weight:400;color:var(--mute);font-size:12.5px;margin-left:6px}
.week .info .sub{font-size:12.5px;color:#6d6257;margin-top:2px}
.week .r{text-align:right}
.week .r .sw i{width:16px;height:16px}
.week .r .rt{font-size:13px;margin-top:4px;min-height:18px}
.note{font-size:11.5px;color:var(--mute);text-align:center;padding:8px 10px 0;line-height:1.7}
.hide{display:none!important}
.hd-r{display:flex;align-items:center;gap:8px}
.gear{border:1px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#5c5145;cursor:pointer}
.gear.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.who{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#efe5d3;border-radius:12px;padding:8px 12px;margin-bottom:10px;font:inherit;font-size:13.5px;color:#5c5145;cursor:pointer;text-align:left}
.who b{color:var(--ink)}.who span{margin-left:auto;color:var(--acc);font-size:12.5px}
.pill.chong{background:var(--bad);color:#fff}
.prof{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:#fffdf8}
.prof.act{border-color:var(--acc);background:#fbefe9}
.prof .av{width:40px;height:40px;border-radius:50%;background:#efe5d3;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:18px;color:var(--acc);flex:none}
.prof .tx{flex:1;min-width:0}.prof .tx b{display:block}.prof .tx small{color:var(--mute);font-size:12.5px}
.prof .ck{color:var(--acc);font-weight:700;font-size:13px}
.prof .ops button{border:0;background:none;color:var(--mute);font:inherit;font-size:12.5px;padding:4px 6px;cursor:pointer}
.fl{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
.fl input{display:block;width:100%;margin-top:4px;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
.prev{min-height:22px;font-size:14px;margin:2px 0 12px;color:var(--acc);font-weight:500}
.frow{display:flex;gap:8px}
.btn{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.hint{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">每日能量曆<small>2026 – 2027</small></div>
  <div class="hd-r"><div class="tabs"><button id="tDay" class="on">今日</button><button id="tWeek">本週</button></div>
  <button id="gear" class="gear" aria-label="設定"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button></div>
</header>
<button id="who" class="who"></button>
<div class="nav">

</div>
<main id="dayView"></main>
<main id="weekView" class="hide"></main>
<main id="setView" class="hide">
  <section class="card"><h3>選擇排盤對象</h3><div id="plist"></div></section>
  <section class="card"><h3 id="fTitle">新增使用者</h3>
    <form id="pform">
      <label class="fl">名稱<input id="fName" maxlength="12" placeholder="例如：王小明" required></label>
      <label class="fl">國曆生日<input id="fBirth" type="date" min="1920-01-01" max="2030-12-31" required></label>
      <div id="fPrev" class="prev"></div>
      <div class="frow"><button type="submit" class="btn pri" id="fSave">儲存並使用</button><button type="button" class="btn hide" id="fCancel">取消編輯</button></div>
    </form>
    <p class="hint">吉凶 👍👎 與 正念小錦囊會依「出生年柱」（以立春為換年分界）重新排盤；顏色、方位、宜忌與能量文案每個人都相同。設定只存在這支手機的瀏覽器裡。</p>
  </section>
</main>
<p class="note">左右滑動可切換日期／週次。顏色、方位、建除、奇門方位依規則推算；宜忌為傳統農民曆推算，僅供參考。</p>
</div>

哪裡去。\n\n多一分慈悲與包容，前輩與長者會看見你，成為你的貴人。","真正的改變，從自我覺察開始。"],"庚午":["今天的能量堅定而有力，內在的動力與紀律都在等你啟動。\n\n靠自己的雙手，把任務一件一件完成，你絕對做得到。\n\n保持積極，也保持清醒；有學新本事的機會，就把握住。","讓活力與企圖心再升一級。"],"辛未":["今天的情緒與表現特別有藝術家的色彩，無論是你或身邊的人。\n\n先把自己的感受理清楚，你就能選擇更好的方式表達自己。\n\n想先保護自己、把真心藏起來也沒關係，只要你明白自己為何這麼做。","覺察情緒，就是管理情緒的開始。"],"壬申":["今天不妨大膽一點，像站在舞台上一樣，生動地表達你的想法與感受。\n\n靈感很多，讓你的聰明好好發揮。\n\n若發現自己反覆回想過去，提醒自己：停在舊問題裡，就走不到新地方。","讓知識與智慧持續擴充，成為你的資料庫。"],"癸酉":["對新想法、新變化敞開心，也願意聽聽別人的建議。\n\n今天特別需要專注，一次只處理一件事就好。\n\n也是感性的一天，安排一頓溫馨的晚餐，陪陪你在乎的人。","把直覺的聲音調大，聽見內在的指引。"],"甲戌":["資源與能量都很充沛的一天，越願意挖掘，收穫越豐富。\n\n留意別讓驕傲擋住自己：願意開口求助，也願意伸手幫人。\n\n善用人脈與資源，溝通更順，執行也更有力。","經營你的人際圈，它會回饋你財富。"],"乙亥":["溫和、謙虛、真誠，是你今天最迷人的地方。\n\n你自然吸引對的人聚在一起，這股力量能幫助事業、人脈與生活。\n\n身邊其實藏著很多有能力的人，包括你自己；放下懷疑，才看得見潛力。","魅力就是吸引力，今天好好發揮它。"],"丙子":["開創的念頭與企圖心都很強，勇敢說出你的看法。\n\n心情愉快，正適合和主管、長官多交流，建立好關係。\n\n只是行事低調一些、照規矩來，也要留意流言。","拓展人脈，讓圈子再大一點。"],"丁丑":["讓內心的光透出來，為別人帶來方向與希望。\n\n用你的知識與經驗去解決問題、幫助他人；持續努力，富足會隨之而來。","累積智慧，做個更通透的人。"],"戊寅":["沉穩低調、步伐穩定，加上實力與努力，就能走到前頭。\n\n只是太固執、太強勢，反而容易惹出麻煩。\n\n說話圓融、做法靈活，人心自然站在你這邊。","強化自信與信念，它會帶你登上頂端。"],"己卯":["像大地一樣包容萬物，對內對外都保持謙和。\n\n追求事業時懂得退一步，不必事事搶第一。\n\n發揮你的藝術天分，主動推自己一把，邁向更好的自己。","努力，是累積財富最可靠的方法。"],"庚辰":["與其等待被發掘，不如主動出擊去爭取。\n\n你聰明又好強，但想太多、太猶豫，反而會原地打轉。\n\n今天的秘訣：先動起來，再邊走邊想。","成功屬於積極行動的人。"],"辛巳":["優雅與氣質讓你今天格外亮眼。\n\n用真誠打動別人，展現你最好的一面。\n\n穩住脾氣、別急躁，用創意與樂觀讓大家刮目相看。","真心分享，最能觸動人心。"],"壬午":["走到哪裡都可能遇上挑戰，先做好準備。\n\n一整天節奏很快、點子很多，但想法要落地，必須靠實際行動。\n\n今天做事要有系統、有步驟，別只憑感覺。","保持平衡，別讓情緒牽著走。"],"癸未":["別讓自我懷疑和消極拖慢今天的腳步。\n\n適合來一次斷捨離：清掉用不到的東西，也放下對你無益的回憶。\n\n照顧別人的同時，也記得你同樣值得被照顧，好好愛自己。","在滋養他人中，找到自己的位置。"],"甲申":["迎向挑戰，你會越挫越勇，成為最能撐下去的人。\n\n別怕改變，你的價值往往在改變中被看見。\n\n身邊話題多，不必每個都參與，少說是非，免惹口舌。","順境時崛起，逆境中重生。"],"乙酉":["好好愛自己，適度打扮能提升自信，也讓你更有吸引力。\n\n環境越艱難，越能逼出你的潛能。\n\n發揮口才、經營人際，放下比較心，讓大家看見你的內涵。","活出被肯定、有價值的自己。"],"丙戌":["真誠、認真、執著是你的特質。找到熱情所在，帶著不服輸的心去完成看似不可能的事。\n\n認真之餘別猶豫，也別衝動；冷靜處理會比發火更有成果。\n\n多用創意，遇到困難也不退縮，決心就是你成功的關鍵。","永不放棄，夢想就會成真。"],"丁亥":["人緣極佳的一天，貴人環繞，你也能獨當一面。\n\n試著分享你的人生經驗，為別人點一盞燈。\n\n少一點堅持己見，多聽聽別人怎麼說，也許會有新的體悟。","鼓勵與引導他人，也找到自己的價值。"],"戊子":["今天帶著一種神秘、朦朧的氣息，讓人捉摸不透。\n\n底牌不必全攤開，凡事保留一點空間。\n\n重新檢視你的財務規劃，可能會從中看見新的商機。","保持一點神秘，讓好奇的人主動靠近。"],"己丑":["足智多謀的一天，才華與真誠同時展現。\n\n這正是你建立影響力與威信的關鍵。\n\n再忙，也要替自己留一段獨處的時光。","增長智慧，在生活中找到平靜與和諧。"],"庚寅":["勇敢接下挑戰！敏銳觀察、謹慎行事、果斷決定，是今天成功的關鍵。\n\n今天可能特別熱鬧、話題特別多；如果你樂在其中，就盡情參與吧。","積極的心態加上理財能力，帶你更上一層樓。"],"辛卯":["開創精神強烈，勤奮、企圖心與信譽的能量都圍繞著你。\n\n往上爬的同時提醒自己：有始有終、堅持到底，才是成功的法則。\n\n把人脈延伸到專業圈子，能讓你的價值更被看見。","經營人際關係，擴大你的交友圈。"],"壬辰":["生命力旺盛、專注力強，今天讓自己充實地忙起來！\n\n良好的人際與社交能力，會讓你的管理能力更上層樓，逐步建立屬於自己的版圖。\n\n不過錢包要看緊，今天特別容易多花錢。","建立正確的金錢觀，財富自然跟上。"],"癸巳":["日月同輝的一天，凡事講求平衡。\n\n提升自己，成為別人的貴人；你也會發現身邊貴人不少。\n\n你聰明又有正能量，只是脾氣稍急；能收住火氣，就是最好的修養。","修養自己，魅力自然散發。"],"甲午":["創意滿滿的一天，跳出框架看世界，視野自然開闊。\n\n感受今天的和諧與喜悅，正向的念頭會帶來希望，也記得把幸福分享出去。\n\n付出一點愛心與力量，讓世界因你更美好。","發揮創意，創造屬於你的奇蹟。"],"乙未":["獨立能幹、內心強大，你享受獨處；這不是寂寞，而是一種內在的平靜。\n\n需要更多靈感時，善用你的人脈與網路，合作會讓工作事半功倍。","經營人脈、提升社交力，讓事業再進一步。"],"丙申":["好奇心旺盛的一天，求知慾會帶你走得更遠、做得更好。\n\n適合重新規劃、升級你的工作流程，善用新工具與新技術。","累積智慧，它會帶來財富與好運。"],"丁酉":["多才多藝、積極進取，你渴望被肯定，也看得很遠。\n\n記住：今天的付出，就是明天的收穫。\n\n表現亮眼難免招來眼紅，不必放在心上。","魅力就是力量，今天就來提升它。"],"戊戌":["今天的氣氛強勢又緊繃，你、主管或身邊的人都可能感到壓力。\n\n每個人面對挑戰的方式不同，有人正面迎戰，有人強勢推進。\n\n若覺得吃力，代表該補充新技能了，學習就是最好的突破口。","保持活力與進取心，在你的領域持續領先。"],"己亥":["享受陽光、享受生活，凡事講求平衡。\n\n一次專注一件事，最省力也最有效率。\n\n提醒自己保持紀律，把已經開始的事完成。","讓生活回到平衡的節奏。"],"庚子":["溝通與說服是你今天的強項，能讓你在人群中發光。\n\n認清並善用自己的才華，吸引對的人，把任務放心交給他們。\n\n若在人群中仍覺得孤單，留意情緒，別讓自己一點就著。","提升溝通力，是今天最重要的功課。"],"辛丑":["傾聽內心的聲音，相信你的直覺。\n\n今天樂觀輕鬆，自信、好運與資源都在身邊。\n\n也因此容易想待在舒適圈，提不起勁面對挑戰。","重新點燃進取心，讓效率與成果一起提升。"],"壬寅":["做一個值得信賴的人，用你的知識、能力與天賦去滋養周遭。\n\n尋找能讓你自由發揮的舞台，釋放你的潛力。\n\n天生的才華，就是你創造財富與好運的關鍵。","釋放你最大的潛能！"],"癸卯":["學習力滿滿的一天，可以從不同角度吸收新知。\n\n把學到的東西轉化成新想法，甚至變成創造收入的機會。\n\n若卡在某個問題裡，別鑽牛角尖，換個角度再想一次。","吸引優質的人走進你的生活。"],"甲辰":["相信自己的信念，讓它像樹根一樣扎穩，風吹也不動搖。\n\n今天不宜急於求成，按部就班最好；凡事留點餘地，別太勉強。\n\n也很適合專心進修，學習新技能來增強實力。","信念的力量，會讓你變得強大。"],"乙巳":["今天目標明確，重視得失，也特別喜歡新鮮事物與新創意。\n\n把人脈延伸到專業圈子，有助於提升自己的價值。\n\n別忘了：有始有終、持續努力，是成功的不二法門。","經營人際關係，拓展你的圈子。"],"丙午":["今天能量飽滿、專注且意志堅定，會是很充實的一天！\n\n良好的人際與社交能力，能幫你帶領團隊，建立自己的版圖。\n\n也練習傾聽，聽懂別人，才能走得更遠。","建立正確的金錢觀，財富自然跟上。"],"丁未":["保持進取的態度，堅持與決心缺一不可！\n\n若結果不如預期，可能會生氣或失落，先讓自己冷靜下來。\n\n今天適合做財務規劃，重新檢視並調整你的理財計畫。","修養自己，魅力自然散發。"],"戊申":["足智多謀的一天，好好運用你的能量與資源；覺得煩躁或疲累 const GWX='木木火火土土金金水水',ZWX={子:'水',丑:'土',寅:'木',卯:'木',辰:'土',巳:'火',午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水'};
const SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'},KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
const GUIREN={甲:'丑未',戊:'丑未',庚:'丑未',乙:'子申',己:'子申',丙:'亥酉',丁:'亥酉',辛:'寅午',壬:'卯巳',癸:'卯巳'};
const WENCHANG={甲:'巳',乙:'午',丙:'申',丁:'酉',戊:'申',己:'酉',庚:'亥',辛:'子',壬:'寅',癸:'卯'};
const CHANGSHENG={甲:'亥',乙:'午',丙:'寅',丁:'酉',戊:'寅',己:'酉',庚:'巳',辛:'子',壬:'申',癸:'卯'};
const SANHE=b=>'申子辰'.includes(b)?0:'寅午戌'.includes(b)?1:'巳酉丑'.includes(b)?2:3;
const TAOHUA=['酉','卯','午','子'],YIMA=['寅','申','亥','巳'];
const LIUHE={子:'丑',丑:'子',寅:'亥',亥:'寅',卯:'戌',戌:'卯',辰:'酉',酉:'辰',巳:'申',申:'巳',午:'未',未:'午'};
function stemOf(el,yang){const i='木火土金水'.indexOf(el)*2;return RG[i+(yang?0:1)]}
function profileRules(yz){ // yz e.g. 戊午
  const S=yz[0],B=yz[1],sw=GWX[RG.indexOf(S)],yang=RG.indexOf(S)%2===0;
  const ctrl=Object.keys(KE).find(k=>KE[k]===sw);
  return {S,B,chong:RZ[(RZ.indexOf(B)+6)%12],gui:GUIREN[S],tao:TAOHUA[SANHE(B)],wen:WENCHANG[S],ma:YIMA[SANHE(B)],
    he:LIUHE[B],cs:CHANGSHENG[S],shishang:SHENG[sw],cai:stemOf(KE[sw],yang),sha:stemOf(ctrl,yang)};
}
function jinnang(P,gz){
  const s=gz[0],b=gz[1],t=[];
  if(b===P.chong)t.push('謹慎理財');
  if(P.gui.includes(b))t.push('貴人扶持');
  if(b===P.tao)t.push('人緣桃花');
  if(b===P.wen)t.push('學習能量');
  if(s===P.cai)t.push('財氣旺盛');
  if(b===P.cs)t.push('行善積福');
  if(b===P.ma)t.push('勞動生財');
  if(ZWX[b]===P.shishang)t.push('能量散煥');
  return [...new Set(t)];
}
function jixiong(P,gz,jc,R){
  const s=gz[0],b=gz[1];
  if(jc==='破')return b===P.chong?-3:-2;
  if(b===P.chong)return s===P.sha?-3:-1;
  if(!'除定執成開'.includes(jc))return 0;
  let sig='';
  if(P.gui.includes(b))sig+='貴';if(b===P.tao)sig+='桃';if(b===P.wen)sig+='文';if(b===P.ma)sig+='馬';if(b===P.B)sig+='本';if(b===P.he)sig+='合';
  if(!sig)return 0;
  if(R.lv[sig+jc]!=null)return R.lv[sig+jc];
  if(R.lb[sig]!=null)return R.lb[sig];
  return sig.length>=2?3:2;
}
function yearPillar(y,m,d,R){ // birth date -> 年柱
  let yy=y; if(m<2||(m===2&&d<(R.lc[y]||4)))yy=y-1;
  return RG[((yy-4)%10+10)%10]+RZ[((yy-4)%12+12)%12];
}


const days=DB.days,T=DB.texts,idx={};days.forEach((d,i)=>idx[d[0]]=i);
const W='日一二三四五六',ANI='鼠牛虎兔龍蛇馬羊猴雞狗豬';
const CS={'青，藍':['#2e8b8b','#2f5fb3'],'紅，橙，紫':['#d23a3a','#ef8a2b','#7d4bb3'],'黃，褐':['#e2b53c','#8a5a2b'],'白，金，淺灰':['#ffffff','#d4af37','#c9c9c9'],'黑，深灰':['#151515','#5a5a5a']};
const DEG={'正北':0,'東北':45,'正東':90,'東南':135,'正南':180,'西南':225,'正西':270,'西北':315};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=d=>{const y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);return y+'-'+m+'-'+dd};
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULT={id:'meta',name:'正念原版',yz:'甲午',birth:'甲午',fixed:true};
let profiles=store.get('profiles',[]),activeId=store.get('active','meta'),editId=null;
const allProfiles=()=>[DEFAULT,...profiles];
const active=()=>allProfiles().find(p=>p.id===activeId)||DEFAULT;
let P=profileRules(active().yz);
let cur=fmt(new Date());if(!(cur in idx))cur=cur<days[0][0]?'2026-01-01':days[days.length-1][0];
let view=store.get('view','day');if(view==='set')view='day';
const sw=c=>'<span class="sw">'+(CS[c]||[]).map(x=>'<i style="background:'+x+'"></i>').join('')+'</span>';
const rate=n=>n>0?'👍'.repeat(n):n<0?'👎'.repeat(-n):'';
const rateTxt=n=>({3:'大吉',2:'吉',1:'小吉','-1':'小心','-2':'凶','-3':'大凶'})[n]||'平';
const arrow=dir=>'<svg class="arrow" viewBox="0 0 16 16" style="transform:rotate('+DEG[dir]+'deg)"><path d="M8 1l4.5 9H9.2v5H6.8v-5H3.5z" fill="#a8322d"/></svg>';
const calc=r=>({jn:jinnang(P,r[1]),jx:jixiong(P,r[1],r[2],RULES),chong:r[1][1]===P.chong});
function dayHTML(r){
  const d=parse(r[0]),txt=T[r[1]]||['',''],c=calc(r);
  const pills=[];
  if(c.chong)pills.push('<span class="pill chong">沖本命・屬'+ANI[RZ.indexOf(P.B)]+'</span>');
  r[21].forEach(f=>pills.push('<span class="pill fest">'+f+'</span>'));
  pills.push('<span class="pill term">'+r[7]+'</span>');
  pills.push('<span class="pill">'+r[2]+'日</span>');pills.push('<span class="pill">'+r[6]+'</span>');
  const dirs=[['朝氣',r[11],'生門'],['天助',r[12],'值符'],['視野',r[13],'九天'],['喜慶',r[14],'喜神'],['財富',r[15],'財神'],['貴人',r[16],'貴神']];
  return `
  <section class="card hero">
    <div class="solar">${d.getFullYear()} 年 ${d.getMonth()+1} 月 · 星期${W[d.getDay()]}</div>
    <div class="big">${d.getDate()}</div>
    <div class="gz">${r[1]}日</div>
    <div class="lunar">農曆 ${r[5]} · ${r[3]}年 ${r[4]}月</div>
    <div class="pills">${pills.join('')}</div>
    <div class="rate"><span class="lbl">今日運勢 · ${rateTxt(c.jx)}</span>${rate(c.jx)||'<span style="font-size:14px;color:#8a7f72">—</span>'}</div>
  </section>
  <section class="card"><h3>正念小錦囊</h3>
    ${c.jn.length?'<div class="chips">'+c.jn.map(x=>'<span class="chip">'+x+'</span>').join('')+'</div>':'<div class="empty">今日無特別提示，平穩度過</div>'}
  </section>
  <section class="card"><h3>幸運顏色</h3><div class="colors">
    <div class="crow"><span class="lv stars">★★★</span>${sw(r[8])}<span class="nm">${r[8]}</span></div>
    <div class="crow"><span class="lv stars">★★</span>${sw(r[9])}<span class="nm">${r[9]}</span></div>
    <div class="crow"><span class="lv stars">★</span>${sw(r[10])}<span class="nm">${r[10]}</span></div>
  </div></section>
  <section class="card"><h3>能量方位</h3><div class="dirs">
    ${dirs.map(x=>`<div class="dir"><div class="k">${x[0]}</div><div class="v">${arrow(x[1])}${x[1]}</div><div class="src">${x[2]}</div></div>`).join('')}
  </div></section>
  <section class="card"><h3>宜忌</h3><div class="yj">
    <span class="t g">宜</span><span class="l">${r[18].length?r[18].join('、'):'—'}</span>
    <span class="t b">忌</span><span class="l">${r[19].length?r[19].join('、'):'—'}</span>
  </div></section>
  <section class="card energy"><h3>正念能量</h3><p>${txt[0]}</p>
    <div class="charge"><span>宇宙能量充電站</span>${txt[1]}</div></section>
  <section class="card"><h3>曆法資料</h3><div class="meta">
    <div><span>年柱</span>${r[3]}</div><div><span>月柱</span>${r[4]}</div>
    <div><span>日柱</span>${r[1]}</div><div><span>建除</span>${r[2]}</div>
    <div><span>節氣</span>${r[7]}</div><div><span>奇門</span>${r[22].replace(/(\D)(\d)/,'$1遁$2局')}</div>
  </div></section>`;
}
function weekHTML(){
  const d=parse(cur),off=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-off);
  const t=fmt(new Date());let rows='';
  for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);const k=fmt(x),r=days[idx[k]];if(!r)continue;const c=calc(r);
    rows+=`<div class="row${k===t?' today':''}${k===cur?' sel':''}" data-k="${k}">
      <div class="d"><b>${x.getDate()}</b><small>週${W[x.getDay()]}</small></div>
      <div class="info"><div class="top">${r[1]}日 <em>${r[2]}日 · ${r[5]}</em></div>
      <div class="sub">${c.chong?'<b style="color:#b23b3b">沖本命</b> · ':''}${r[21].length?r[21].join('・')+' · ':''}${c.jn.length?c.jn.join('・'):'平穩'}</div></div>
      <div class="r">${sw(r[8])}<div class="rt">${rate(c.jx)}</div></div></div>`;}
  return '<section class="card week">'+rows+'</section>';
}
const descr=p=>p.yz+'年・屬'+ANI[RZ.indexOf(p.yz[1])];
function setHTML(){
  $('#plist').innerHTML=allProfiles().map(p=>`<div class="prof${p.id===activeId?' act':''}" data-id="${p.id}">
    <div class="av">${esc(p.name.slice(0,1))}</div>
    <div class="tx"><b>${esc(p.name)}</b><small>${p.fixed?'甲午年・屬馬（預設盤）':esc(p.birth)+'・'+descr(p)}</small></div>
    ${p.id===activeId?'<span class="ck">使用中</span>':''}
    ${p.fixed?'':`<span class="ops"><button data-ed="${p.id}">編輯</button><button data-del="${p.id}">刪除</button></span>`}</div>`).join('');
  document.querySelectorAll('.prof').forEach(e=>e.onclick=ev=>{
    const ed=ev.target.dataset.ed,del=ev.target.dataset.del;
    if(ed){startEdit(ed);return}
    if(del){const b=ev.target;if(b.dataset.sure){profiles=profiles.filter(p=>p.id!==del);if(activeId===del)activeId='meta';save();setHTML();}else{b.dataset.sure=1;b.textContent='確定刪除？';b.style.color='#b23b3b'}return}
    activeId=e.dataset.id;save();setView('day');
  });
}
function startEdit(id){const p=profiles.find(x=>x.id===id);editId=id;$('#fName').value=p.name;$('#fBirth').value=p.birth;$('#fTitle').textContent='編輯：'+p.name;$('#fSave').textContent='儲存';$('#fCancel').classList.remove('hide');preview();$('#pform').scrollIntoView({behavior:'smooth'})}
function resetForm(){editId=null;$('#pform').reset();$('#fTitle').textContent='新增使用者';$('#fSave').textContent='儲存並使用';$('#fCancel').classList.add('hide');$('#fPrev').textContent=''}
function yzOf(b){const[y,m,d]=b.split('-').map(Number);return yearPillar(y,m,d,RULES)}
function preview(){const b=$('#fBirth').value;if(!b){$('#fPrev').textContent='';return}const[y,m,d]=b.split('-').map(Number);const yz=yzOf(b);
  const early=(m<2||(m===2&&d<(RULES.lc[y]||4)));
  $('#fPrev').textContent='出生年柱：'+yz+'・屬'+ANI[RZ.indexOf(yz[1])]+(early?'（生於立春前，算前一年）':'');}
function save(){store.set('profiles',profiles);store.set('active',activeId);P=profileRules(active().yz)}
$('#fBirth').oninput=preview;
$('#fCancel').onclick=resetForm;
$('#pform').onsubmit=e=>{e.preventDefault();const name=$('#fName').value.trim(),birth=$('#fBirth').value;if(!name||!birth)return;
  const yz=yzOf(birth);
  if(editId){const p=profiles.find(x=>x.id===editId);Object.assign(p,{name,birth,yz});}
  else{const id='p'+Date.now().toString(36);profiles.push({id,name,birth,yz});activeId=id;}
  const wasEdit=!!editId;resetForm();save();if(wasEdit)setHTML();else setView('day');};
function render(){
  const d=parse(cur),a=active();
  $('#who').innerHTML='排盤對象：<b>'+esc(a.name)+'</b>（'+descr(a)+'）<span>切換 ›</span>';
  $('#pick').value=cur;$('#pick').min=days[0][0];$('#pick').max=days[days.length-1][0];
  if(view==='day'){$('#navLbl').textContent=`${d.getMonth()+1}/${d.getDate()} 週${W[d.getDay()]} ▾`;$('#dayView').innerHTML=dayHTML(days[idx[cur]]);}
  else if(view==='week'){const off=(d.getDay()+6)%7,m=new Date(d);m.setDate(d.getDate()-off);const s=new Date(m);s.setDate(m.getDate()+6);
    $('#navLbl').textContent=`${m.getMonth()+1}/${m.getDate()} – ${s.getMonth()+1}/${s.getDate()} ▾`;$('#weekView').innerHTML=weekHTML();
    document.querySelectorAll('.week .row').forEach(e=>e.onclick=()=>{cur=e.dataset.k;setView('day')});}
  else setHTML();
  $('#dayView').classList.toggle('hide',view!=='day');$('#weekView').classList.toggle('hide',view!=='week');$('#setView').classList.toggle('hide',view!=='set');
  $('.nav').classList.toggle('hide',view==='set');$('#who').classList.toggle('hide',view==='set');$('.note').classList.toggle('hide',view==='set');
  $('#tDay').classList.toggle('on',view==='day');$('#tWeek').classList.toggle('on',view==='week');$('#gear').classList.toggle('on',view==='set');
  $('#tDay').textContent=cur===fmt(new Date())?'今日':'單日';
}
function setView(v){view=v;if(v!=='set')store.set('view',v);render();scrollTo(0,0)}
function move(n){const d=parse(cur);d.setDate(d.getDate()+(view==='week'?7*n:n));const k=fmt(d);if(k in idx){cur=k;render()}}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
$('#today').onclick=()=>{const k=fmt(new Date());if(k in idx)cur=k;render()};
$('#pick').onchange=e=>{if(e.target.value in idx){cur=e.target.value;render()}};
$('#tDay').onclick=()=>setView('day');$('#tWeek').onclick=()=>setView('week');
$('#gear').onclick=()=>setView(view==='set'?'day':'set');$('#who').onclick=()=>setView('set');
let sx=null,sy=null;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null||view==='set')return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1);sx=null},{passive:true});
if(!store.get('profiles',null)&&!store.get('seen',false)){store.set('seen',true);view='set';}
render();

</script>
